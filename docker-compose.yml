services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: homevision-checkbox-detection:latest
    restart: unless-stopped
    # Dokploy: do not bind host ports; Traefik routes by domain to container port 8000.
    expose:
      - "8000"
    networks:
      - dokploy-network
    environment:
      PYTHONUNBUFFERED: "1"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"

networks:
  dokploy-network:
    external: true

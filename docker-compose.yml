services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: homevision-checkbox-detection:latest
    container_name: homevision-checkbox-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # TODO(production): enforce max upload size in app code and set limits here
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # OpenCV detection is CPU-bound; one worker avoids duplicate memory use.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
